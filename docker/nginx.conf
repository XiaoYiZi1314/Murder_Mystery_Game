upstream shisanwu_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Only reencoded public images; private volume is never mounted here.
    location ~ ^/uploads/([a-f0-9]{32}(?:-thumb)?\.webp)$ {
        alias /srv/uploads/$1;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /uploads/ { return 404; }
    location /private-media/ { return 404; }

    location / {
        proxy_pass http://shisanwu_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
